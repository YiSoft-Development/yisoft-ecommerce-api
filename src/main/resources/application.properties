# Application
spring.application.name=yisoft-ecommerce-api

# Logging
logging.level.root=@LOG_LEVEL_ROOT@
logging.level.com.yisoft.development.ecommerce=@LOG_LEVEL_APP@

# R2DBC
spring.r2dbc.url=r2dbc:postgresql://@POSTGRES_HOST@:@POSTGRES_PORT@/@POSTGRES_DB@
spring.r2dbc.username=@POSTGRES_USER@
spring.r2dbc.password=@POSTGRES_PASSWORD@
spring.r2dbc.pool.initial-size=2
spring.r2dbc.pool.max-size=10
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.validation-query=SELECT 1

# Flyway
spring.flyway.url=jdbc:postgresql://@POSTGRES_HOST@:@POSTGRES_PORT@/@POSTGRES_DB@
spring.flyway.user=@POSTGRES_USER@
spring.flyway.password=@POSTGRES_PASSWORD@
spring.flyway.out-of-order=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,r2dbc
management.endpoint.health.show-details=@HEALTH_SHOW_DETAILS@
management.endpoint.health.show-components=@HEALTH_SHOW_DETAILS@

# OpenTelemetry
management.tracing.sampling.probability=@TRACING_SAMPLING_PROBABILITY@
management.opentelemetry.tracing.export.otlp.endpoint=@OTLP_ENDPOINT@/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=@OTLP_ENDPOINT@/v1/logs
management.otlp.metrics.export.url=@OTLP_ENDPOINT@/v1/metrics

# MDC Context
logging.pattern.correlation=[%X{xTraceId:-}] [%X{traceId:-},%X{spanId:-}] 