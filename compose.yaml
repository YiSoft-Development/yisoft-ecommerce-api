name: yisoft-ecommerce
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Error: You must specify a POSTGRES_DB in your .env file!}"
      POSTGRES_USER: "${POSTGRES_USER:?Error: You must specify a POSTGRES_USER in your .env file!}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: You must specify a POSTGRES_PASSWORD in your .env file!}"
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: "redis-server --requirepass ${REDIS_PASSWORD:?Error: REDIS_PASSWORD es requerida} --appendonly yes"
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?Error: You must specify a RABBITMQ_USER in your .env file!}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Error: You must specify a RABBITMQ_PASSWORD in your .env file!}"
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:v1.32.0
    healthcheck:
      test: [ "CMD-SHELL", "/mailpit readyz" ]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
